<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>タスク管理</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    background: #ffd60a;
    font-family: "Helvetica Neue", Arial, sans-serif;
    padding: 40px 16px;
  }
  .container {
    width: 100%;
    max-width: 480px;
  }
  h1 {
    color: #1e1e2e;
    text-align: center;
    margin: 0 0 24px;
    font-size: 2rem;
  }
  .input-row {
    display: flex;
    gap: 8px;
    margin-bottom: 16px;
  }
  #taskInput {
    flex: 1;
    padding: 12px 14px;
    font-size: 1rem;
    border: none;
    border-radius: 8px;
    outline: none;
  }
  #addBtn {
    padding: 12px 20px;
    font-size: 1rem;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    color: #fff;
    background: #4caf50;
    transition: opacity 0.15s;
  }
  #addBtn:active { opacity: 0.7; }
  #count {
    color: #1e1e2e;
    margin-bottom: 12px;
    font-size: 0.9rem;
  }
  #taskList {
    list-style: none;
    margin: 0;
    padding: 0;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .task-item {
    display: flex;
    align-items: center;
    gap: 12px;
    background: #fff;
    border-radius: 8px;
    padding: 12px 14px;
  }
  .task-item input[type="checkbox"] {
    width: 20px;
    height: 20px;
    flex-shrink: 0;
    cursor: pointer;
  }
  .task-text {
    flex: 1;
    color: #1e1e2e;
    word-break: break-word;
  }
  .task-item.done .task-text {
    text-decoration: line-through;
    color: #9e9e9e;
  }
  .delete-btn {
    border: none;
    background: #e53935;
    color: #fff;
    border-radius: 6px;
    width: 28px;
    height: 28px;
    cursor: pointer;
    font-size: 1rem;
    line-height: 1;
    flex-shrink: 0;
    transition: opacity 0.15s;
  }
  .delete-btn:active { opacity: 0.7; }
  .empty {
    text-align: center;
    color: #6b6b4d;
    padding: 24px 0;
  }
</style>
</head>
<body>
  <div class="container">
    <h1>タスク管理</h1>
    <div class="input-row">
      <input type="text" id="taskInput" placeholder="新しいタスクを入力">
      <button id="addBtn">追加</button>
    </div>
    <div id="count"></div>
    <ul id="taskList"></ul>
  </div>

<script>
  const STORAGE_KEY = 'taskManagerTasks';
  const taskInput = document.getElementById('taskInput');
  const addBtn = document.getElementById('addBtn');
  const taskList = document.getElementById('taskList');
  const count = document.getElementById('count');

  let tasks = loadTasks();

  function loadTasks() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      return raw ? JSON.parse(raw) : [];
    } catch {
      return [];
    }
  }

  function saveTasks() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
    } catch {
      // localStorageが使えない環境ではメモリ内のみで動作
    }
  }

  function render() {
    taskList.innerHTML = '';

    if (tasks.length === 0) {
      const empty = document.createElement('li');
      empty.className = 'empty';
      empty.textContent = 'タスクがありません';
      taskList.appendChild(empty);
    } else {
      tasks.forEach(task => {
        const li = document.createElement('li');
        li.className = 'task-item' + (task.done ? ' done' : '');

        const checkbox = document.createElement('input');
        checkbox.type = 'checkbox';
        checkbox.checked = task.done;
        checkbox.addEventListener('change', () => {
          task.done = checkbox.checked;
          saveTasks();
          render();
        });

        const text = document.createElement('span');
        text.className = 'task-text';
        text.textContent = task.text;

        const deleteBtn = document.createElement('button');
        deleteBtn.className = 'delete-btn';
        deleteBtn.textContent = '×';
        deleteBtn.addEventListener('click', () => {
          tasks = tasks.filter(t => t.id !== task.id);
          saveTasks();
          render();
        });

        li.appendChild(checkbox);
        li.appendChild(text);
        li.appendChild(deleteBtn);
        taskList.appendChild(li);
      });
    }

    const remaining = tasks.filter(t => !t.done).length;
    count.textContent = `残り ${remaining} 件 / 全 ${tasks.length} 件`;
  }

  function addTask() {
    const text = taskInput.value.trim();
    if (!text) return;
    tasks.push({ id: Date.now(), text, done: false });
    taskInput.value = '';
    saveTasks();
    render();
    taskInput.focus();
  }

  addBtn.addEventListener('click', addTask);
  taskInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') addTask();
  });

  render();
</script>
</body>
</html>
